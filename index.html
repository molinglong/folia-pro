<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="一个动态歌词播放器，支持 AI 主题生成" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Folia" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Folia</title>
    <script src="/runtime-config.js"></script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-i18next": "https://aistudiocdn.com/react-i18next@^16.3.5",
    "i18next": "https://aistudiocdn.com/i18next@^25.6.3",
    "i18next-browser-languagedetector": "https://aistudiocdn.com/i18next-browser-languagedetector@^8.2.0"
  }
}
</script>
    <!-- 首屏加载遮罩：内联样式，随 HTML 首帧一起绘制，不等 index.css 与 JS bundle。
         由 src/utils/appSplash.ts 在 React 挂载后淡出并移除。 -->
    <style>
      html,
      body {
        background-color: #09090b;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 320ms ease;
      }

      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }

      #app-splash .app-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        opacity: 0;
        /* 延迟淡入：命中缓存的秒开不会闪一下遮罩内容。 */
        animation: app-splash-in 420ms ease 180ms forwards;
      }

      /* 墨点扩散：一滴白墨在暗纸上周期性洇开，外扩一圈涟漪，词标随之浮现。
         深底沿用 app 启动色 #09090b，淡出交接不会亮→暗闪屏。 */

      /* 涟漪：细边框圆环从中心放大并淡出，模拟墨向外渗的边界。 */
      #app-splash .app-splash-ink {
        position: relative;
        width: clamp(84px, 15vw, 140px);
        height: clamp(84px, 15vw, 140px);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #app-splash .app-splash-ripple {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.5);
        /* 只用 transform + opacity 做动画：走合成器线程，不触发布局、不占主线程。 */
        animation: app-splash-ripple 2400ms cubic-bezier(0.22, 1, 0.36, 1) infinite;
        will-change: transform, opacity;
      }

      /* 墨滴：实心亮点，放大成一片柔光后收回去，节奏比涟漪稍快半拍。 */
      #app-splash .app-splash-drop {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ffffff;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.55), 0 0 30px rgba(255, 255, 255, 0.28);
        animation: app-splash-drop 2400ms cubic-bezier(0.22, 1, 0.36, 1) infinite;
        will-change: transform, opacity;
      }

      /* 词标：细字重大字距，随墨滴洇开若隐若现。 */
      #app-splash .app-splash-title {
        font-size: clamp(20px, 4.2vw, 34px);
        font-weight: 300;
        line-height: 1;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: #ffffff;
        animation: app-splash-title 2400ms ease-in-out infinite;
      }

      @keyframes app-splash-in {
        to {
          opacity: 1;
        }
      }

      @keyframes app-splash-ripple {
        0% {
          transform: scale(1);
          opacity: 0;
        }
        18% {
          opacity: 0.65;
        }
        100% {
          transform: scale(11);
          opacity: 0;
        }
      }

      @keyframes app-splash-drop {
        0%,
        100% {
          transform: scale(0.6);
          opacity: 0.35;
        }
        40% {
          transform: scale(1.4);
          opacity: 1;
        }
      }

      @keyframes app-splash-title {
        0%,
        100% {
          opacity: 0.32;
        }
        42% {
          opacity: 0.82;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash-inner {
          opacity: 1;
          animation: none;
        }

        /* 不动，但保留一滴静止的墨和词标，遮罩仍然有内容而非纯黑屏。 */
        #app-splash .app-splash-ripple {
          animation: none;
          opacity: 0;
        }

        #app-splash .app-splash-drop {
          animation: none;
          transform: scale(1);
          opacity: 1;
        }

        #app-splash .app-splash-title {
          animation: none;
          opacity: 0.8;
        }
      }
    </style>
</head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading Folia">
      <div class="app-splash-inner">
        <div class="app-splash-ink" aria-hidden="true">
          <span class="app-splash-ripple"></span>
          <span class="app-splash-drop"></span>
        </div>
        <div class="app-splash-title">Folia</div>
      </div>
    </div>
    <script>
      (function () {
        try {
          // 需要透明背景的入口不能盖遮罩：OBS 浏览器源会被直接推流捕获，
          // Electron 的透明播放背景 / 壁纸窗口（main.cjs 传 splash=0）会在桌面上闪一个黑块。
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.remove();
            }
            return;
          }
        } catch (error) {
          // 探测失败时保留遮罩，React 挂载后仍会移除它。
        }
        // 墨点扩散完全由内联 CSS 驱动，无需脚本；只保留上面的 OBS / splash=0 跳过判断。
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
